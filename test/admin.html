<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Firebase Admin Panel | Complete Management</title>
    <!-- Tailwind + Font Awesome -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { transition: all 0.2s ease; }
        .table-container { scrollbar-width: thin; }
        .delete-btn:hover { background-color: #b91c1c !important; transform: scale(1.02); }
        .page-btn.active { background-color: #1e3a8a !important; color: white !important; }
        .card-shadow { box-shadow: 0 20px 35px -12px rgba(0, 0, 0, 0.1); }
        .metadata-cell { max-width: 180px; white-space: nowrap; overflow-x: auto; display: inline-block; font-family: monospace; font-size: 0.7rem; }
        .modal-backdrop { background-color: rgba(0,0,0,0.5); backdrop-filter: blur(2px); }
        input, select, textarea { transition: all 0.2s; }
        /* Custom toggle checkbox style */
        .access-checkbox {
            width: 1.25rem;
            height: 1.25rem;
            cursor: pointer;
            accent-color: #10b981;
            transition: all 0.1s;
        }
        .access-checkbox:hover {
            transform: scale(1.1);
        }
    </style>
</head>
<body class="bg-gray-100 font-sans antialiased">

<div class="max-w-full xl:max-w-[1400px] mx-auto px-4 sm:px-6 lg:px-8 py-6">
    <!-- Header with title and stats -->
    <div class="flex flex-wrap justify-between items-center mb-6 gap-4">
        <div class="flex items-center space-x-3">
            <i class="fab fa-firebase text-4xl text-orange-500 drop-shadow-sm"></i>
            <div>
                <h1 class="text-2xl md:text-3xl font-bold text-gray-800 tracking-tight">Firebase Admin Console</h1>
                <p class="text-sm text-gray-500 mt-0.5">Manage users, access, metadata & credentials</p>
            </div>
        </div>
        <div class="bg-white rounded-full px-4 py-2 shadow-sm border flex items-center gap-2">
            <i class="fas fa-database text-blue-500"></i>
            <span class="text-sm font-medium text-gray-700">Live Data</span>
            <span class="inline-block w-2 h-2 bg-green-500 rounded-full animate-pulse"></span>
        </div>
    </div>

    <!-- Stats Cards -->
    <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-6">
        <div class="bg-white rounded-xl p-4 shadow-sm border-l-4 border-blue-500">
            <div class="flex justify-between">
                <div><p class="text-gray-500 text-xs uppercase">Total users</p><p class="text-2xl font-bold" id="totalUsersCount">0</p></div>
                <i class="fas fa-users text-3xl text-blue-200"></i>
            </div>
        </div>
        <div class="bg-white rounded-xl p-4 shadow-sm border-l-4 border-green-500">
            <div class="flex justify-between">
                <div><p class="text-gray-500 text-xs uppercase">Active access</p><p class="text-2xl font-bold" id="activeAccessCount">0</p></div>
                <i class="fas fa-check-circle text-3xl text-green-200"></i>
            </div>
        </div>
        <div class="bg-white rounded-xl p-4 shadow-sm border-l-4 border-purple-500">
            <div class="flex justify-between">
                <div><p class="text-gray-500 text-xs uppercase">Entries</p><p class="text-2xl font-bold" id="metadataCount">0</p></div>
                <i class="fas fa-calendar-alt text-3xl text-purple-200"></i>
            </div>
        </div>
    </div>

    <!-- Action Bar: search, add, download, refresh, show passwords -->
    <div class="bg-white rounded-2xl shadow-sm p-4 mb-6 flex flex-wrap justify-between items-center gap-3 border border-gray-200">
        <div class="flex flex-wrap gap-3 items-center flex-1">
            <div class="relative flex-1 min-w-[200px]">
                <i class="fas fa-search absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 text-sm"></i>
                <input type="text" id="searchInput" placeholder="Filter by name, email or ID..." class="w-full pl-9 pr-4 py-2 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-400 focus:outline-none text-sm">
            </div>
            <button id="refreshBtn" class="bg-gray-100 hover:bg-gray-200 text-gray-700 px-4 py-2 rounded-xl transition shadow-sm flex items-center gap-2"><i class="fas fa-sync-alt"></i> Refresh</button>
            <button id="addUserBtn" class="bg-blue-600 hover:bg-blue-700 text-white px-5 py-2 rounded-xl transition shadow-md flex items-center gap-2"><i class="fas fa-plus-circle"></i> Add User</button>
            <button id="downloadBtn" class="bg-green-600 hover:bg-green-700 text-white px-5 py-2 rounded-xl transition shadow-md flex items-center gap-2"><i class="fas fa-download"></i> Export CSV</button>
            <button id="togglePasswordsBtn" class="bg-purple-100 hover:bg-purple-200 text-purple-700 px-4 py-2 rounded-xl transition shadow-sm flex items-center gap-2"><i class="fas fa-eye"></i> Show Passwords</button>
        </div>
        <div class="text-xs text-gray-400 bg-gray-50 px-3 py-1 rounded-full"><i class="fas fa-filter mr-1"></i> real-time filter</div>
    </div>

    <!-- Admin Table Card -->
    <div class="bg-white rounded-2xl shadow-lg card-shadow overflow-hidden border border-gray-200">
        <div class="overflow-x-auto table-container">
            <table class="min-w-full divide-y divide-gray-200">
                <thead class="bg-gray-50">
                    <tr>
                        <th class="px-4 py-3 text-left text-xs font-semibold text-gray-500 uppercase">#</th>
                        <th class="px-4 py-3 text-left text-xs font-semibold text-gray-500 uppercase">ID</th>
                        <th class="px-4 py-3 text-left text-xs font-semibold text-gray-500 uppercase">Email</th>
                        <th class="px-4 py-3 text-left text-xs font-semibold text-gray-500 uppercase">Name</th>
                        <th class="px-4 py-3 text-center text-xs font-semibold text-gray-500 uppercase">Access</th>
                        <th class="px-4 py-3 text-left text-xs font-semibold text-gray-500 uppercase">_id (Doc)</th>
                        <th class="px-4 py-3 text-left text-xs font-semibold text-gray-500 uppercase">Metadata</th>
                        <th class="px-4 py-3 text-left text-xs font-semibold text-gray-500 uppercase">Date Registered</th>
                        <th class="px-4 py-3 text-left text-xs font-semibold text-gray-500 uppercase">Password</th>
                        <th class="px-4 py-3 text-center text-xs font-semibold text-gray-500 uppercase">Actions</th>
                    </tr>
                </thead>
                <tbody id="userTableBody" class="bg-white divide-y divide-gray-100">
                    <!-- dynamic rows injected -->
                </tbody>
            </table>
        </div>
        <!-- Pagination Footer -->
        <div class="bg-gray-50 px-6 py-4 border-t border-gray-200 flex flex-col sm:flex-row justify-between items-center gap-4">
            <div class="text-sm text-gray-600 font-medium" id="paginationInfo">0 results</div>
            <div class="flex items-center space-x-2" id="paginationControls"></div>
        </div>
    </div>
</div>

<!-- Modal for Add User (hidden by default) -->
<div id="addUserModal" class="fixed inset-0 z-50 flex items-center justify-center modal-backdrop hidden transition-all">
    <div class="bg-white rounded-2xl w-full max-w-2xl mx-4 shadow-2xl transform transition-all">
        <div class="flex justify-between items-center border-b px-6 py-4 bg-gray-50 rounded-t-2xl">
            <h3 class="text-xl font-bold text-gray-800"><i class="fas fa-user-plus text-blue-500 mr-2"></i> Add New User</h3>
            <button id="closeModalBtn" class="text-gray-400 hover:text-gray-600"><i class="fas fa-times text-xl"></i></button>
        </div>
        <div class="p-6 grid grid-cols-1 md:grid-cols-2 gap-5">
            <div><label class="block text-sm font-medium text-gray-700">ID *</label><input type="text" id="newId" class="mt-1 w-full border rounded-lg p-2 text-sm"></div>
            <div><label class="block text-sm font-medium text-gray-700">Email *</label><input type="email" id="newEmail" class="mt-1 w-full border rounded-lg p-2 text-sm"></div>
            <div><label class="block text-sm font-medium text-gray-700">Full Name *</label><input type="text" id="newName" class="mt-1 w-full border rounded-lg p-2 text-sm"></div>
            <div class="flex items-center space-x-3 mt-6"><label class="text-sm font-medium text-gray-700">Access</label><input type="checkbox" id="newAccess" class="w-5 h-5 rounded border-gray-300 text-blue-600" checked></div>
            <div><label class="block text-sm font-medium text-gray-700">Document ID (_id)</label><input type="text" id="newDocId" placeholder="auto-generate or custom" class="mt-1 w-full border rounded-lg p-2 text-sm"></div>
            <div><label class="block text-sm font-medium text-gray-700">Metadata (JSON)</label><textarea id="newMetadata" rows="2" class="mt-1 w-full border rounded-lg p-2 text-sm font-mono">{"segments": ["test"]}</textarea></div>
            <div><label class="block text-sm font-medium text-gray-700">Date Registered</label><input type="date" id="newDateReg" class="mt-1 w-full border rounded-lg p-2 text-sm"></div>
            <div><label class="block text-sm font-medium text-gray-700">Password</label><input type="text" id="newPassword" placeholder="Enter plain password" class="mt-1 w-full border rounded-lg p-2 text-sm"></div>
        </div>
        <div class="bg-gray-50 px-6 py-4 rounded-b-2xl flex justify-end gap-3">
            <button id="cancelModalBtn" class="px-4 py-2 border rounded-lg text-gray-600 hover:bg-gray-100">Cancel</button>
            <button id="confirmAddBtn" class="px-5 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg shadow-md"><i class="fas fa-save mr-1"></i> Create User</button>
        </div>
    </div>
</div>

<!-- The core Firebase JS SDK is always required and must be listed first -->
<script src="https://www.gstatic.com/firebasejs/7.14.5/firebase-app.js"></script>

<!-- Add the Firebase Authentication SDK -->
<script src="https://www.gstatic.com/firebasejs/7.8.0/firebase-auth.js"></script>

<script>
    var firebaseConfig = {
    apiKey: "<API_KEY>",
    authDomain: "<PROJECT_ID>.firebaseapp.com",
    projectId: "<PROJECT_ID>",
    storageBucket: "<BUCKET>.appspot.com",
    messagingSenderId: "<SENDER_ID>",
    appId: "<APP_ID>"
    };

    // Initialize Firebase
    firebase.initializeApp(firebaseConfig);

    const auth = firebase.auth();
    
    // ---------- Generate enhanced dataset with actual passwords, dateRegistered ----------
    const randomDate = (start, end) => new Date(start.getTime() + Math.random() * (end.getTime() - start.getTime())).toISOString().split('T')[0];
    const startDate = new Date(2023, 0, 1);
    const endDate = new Date(2025, 2, 28);
    
    const randomPassword = () => {
        const chars = 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789!@#$%';
        let pwd = '';
        for (let i = 0; i < 8; i++) pwd += chars[Math.floor(Math.random() * chars.length)];
        return pwd;
    };

    // Global state
    let allUsers = createInitialUsers();   // master dataset
    let filteredUsers = [...allUsers];
    let currentPage = 1;
    const rowsPerPage = 10;
    let currentSearchTerm = "";
    let showPasswords = false;

    function updateStats() {
        document.getElementById('totalUsersCount').innerText = allUsers.length;
        const activeCount = allUsers.filter(u => u.access === true).length;
        document.getElementById('activeAccessCount').innerText = activeCount;
        document.getElementById('metadataCount').innerText = allUsers.length;
    }

    function applyFilter() {
        if (!currentSearchTerm.trim()) {
            filteredUsers = [...allUsers];
        } else {
            const term = currentSearchTerm.toLowerCase();
            filteredUsers = allUsers.filter(user => 
                user.name.toLowerCase().includes(term) ||
                user.email.toLowerCase().includes(term) ||
                user.id.toLowerCase().includes(term)
            );
        }
        currentPage = 1;
        renderTable();
    }

    // Toggle access for a user
    function toggleAccess(docId) {
        const user = allUsers.find(u => u.docId === docId);
        if (user) {
            user.access = !user.access;
            // Re-apply filter to keep filteredUsers in sync
            applyFilter();
            updateStats();
        }
    }

    function renderTable() {
        const tbody = document.getElementById('userTableBody');
        if (!tbody) return;
        const startIdx = (currentPage - 1) * rowsPerPage;
        const paginated = filteredUsers.slice(startIdx, startIdx + rowsPerPage);
        
        if (paginated.length === 0 && filteredUsers.length > 0 && currentPage > 1) {
            currentPage = Math.max(1, Math.ceil(filteredUsers.length / rowsPerPage));
            return renderTable();
        }
        
        tbody.innerHTML = '';
        paginated.forEach((user, idx) => {
            const globalIdx = startIdx + idx + 1;
            let metaStr = JSON.stringify(user.metadata);
            if (metaStr.length > 38) metaStr = metaStr.slice(0, 35) + '...';
            const passwordDisplay = showPasswords ? user.password : '••••••••';
            
            const row = document.createElement('tr');
            row.className = 'hover:bg-gray-50 transition';
            row.innerHTML = `
                <td class="px-4 py-3 whitespace-nowrap text-sm font-medium text-gray-700">${globalIdx}</td>
                <td class="px-4 py-3 whitespace-nowrap text-sm text-gray-800 font-mono">${escapeHtml(user.id)}</td>
                <td class="px-4 py-3 whitespace-nowrap text-sm text-gray-700">${escapeHtml(user.email)}</td>
                <td class="px-4 py-3 whitespace-nowrap text-sm text-gray-800 font-medium">${escapeHtml(user.name)}</td>
                <td class="px-4 py-3 whitespace-nowrap text-center">
                    <input type="checkbox" class="access-checkbox" data-docid="${escapeHtml(user.docId)}" ${user.access ? 'checked' : ''}>
                </td>
                <td class="px-4 py-3 whitespace-nowrap text-xs font-mono text-gray-500">${escapeHtml(user.docId)}</td>
                <td class="px-4 py-3 text-xs text-gray-600 font-mono"><div class="metadata-cell bg-gray-50 px-1 py-0.5 rounded border max-w-[160px] overflow-x-auto">${escapeHtml(metaStr)}</div></td>
                <td class="px-4 py-3 whitespace-nowrap text-sm text-gray-600">${escapeHtml(user.dateRegistered)}</td>
                <td class="px-4 py-3 whitespace-nowrap text-sm font-mono text-gray-500">${escapeHtml(passwordDisplay)}</td>
                <td class="px-4 py-3 whitespace-nowrap text-center">
                    <button class="delete-user-btn bg-red-50 hover:bg-red-600 text-red-600 hover:text-white py-1.5 px-3 rounded-lg transition shadow-sm flex items-center gap-1 mx-auto" data-docid="${escapeHtml(user.docId)}">
                        <i class="fas fa-trash-alt text-xs"></i> <span class="text-xs">Delete</span>
                    </button>
                </td>
            `;
            tbody.appendChild(row);
        });
        
        // Attach event listeners for access checkboxes
        document.querySelectorAll('.access-checkbox').forEach(cb => {
            cb.removeEventListener('change', handleAccessChange);
            cb.addEventListener('change', handleAccessChange);
        });
        attachDeleteEvents();
        updatePaginationControls();
        updatePaginationInfo();
    }
    
    function handleAccessChange(e) {
        const docId = e.target.getAttribute('data-docid');
        if (docId) toggleAccess(docId);
    }
    
    function attachDeleteEvents() {
        document.querySelectorAll('.delete-user-btn').forEach(btn => {
            btn.removeEventListener('click', handleDeleteClick);
            btn.addEventListener('click', handleDeleteClick);
        });
    }
    
    function handleDeleteClick(e) {
        const docId = this.getAttribute('data-docid');
        if (docId) deleteUserByDocId(docId);
    }
    
    function deleteUserByDocId(docId) {
        const user = allUsers.find(u => u.docId === docId);
        if (!user) return;
        if (confirm(`Delete user "${user.name}" (${user.email})? This action is permanent.`)) {
            allUsers = allUsers.filter(u => u.docId !== docId);
            applyFilter();
            updateStats();
        }
    }
    
    function updatePaginationControls() {
        const container = document.getElementById('paginationControls');
        if (!container) return;
        const totalPages = Math.max(1, Math.ceil(filteredUsers.length / rowsPerPage));
        if (filteredUsers.length === 0) {
            container.innerHTML = `<button disabled class="px-3 py-1 border rounded-md bg-gray-100 text-gray-400"><i class="fas fa-chevron-left"></i></button>
            <span class="px-3 text-gray-500">0 / 0</span>
            <button disabled class="px-3 py-1 border rounded-md bg-gray-100 text-gray-400"><i class="fas fa-chevron-right"></i></button>`;
            return;
        }
        let html = `<button id="prevPageBtn" class="px-3 py-1.5 border rounded-lg bg-white hover:bg-gray-100 ${currentPage === 1 ? 'opacity-50 cursor-not-allowed' : ''}" ${currentPage === 1 ? 'disabled' : ''}><i class="fas fa-chevron-left mr-1"></i> Prev</button>`;
        let startPage = Math.max(1, currentPage - 2);
        let endPage = Math.min(totalPages, startPage + 4);
        if (endPage - startPage < 4 && startPage > 1) startPage = Math.max(1, endPage - 4);
        for (let i = startPage; i <= endPage; i++) {
            const activeClass = i === currentPage ? 'active bg-blue-700 text-white border-blue-700' : 'bg-white text-gray-700 hover:bg-gray-100';
            html += `<button class="page-num-btn px-3 py-1.5 border rounded-lg mx-1 font-medium ${activeClass}" data-page="${i}">${i}</button>`;
        }
        html += `<button id="nextPageBtn" class="px-3 py-1.5 border rounded-lg bg-white hover:bg-gray-100 ${currentPage === totalPages ? 'opacity-50 cursor-not-allowed' : ''}" ${currentPage === totalPages ? 'disabled' : ''}>Next <i class="fas fa-chevron-right ml-1"></i></button>`;
        container.innerHTML = html;
        
        document.getElementById('prevPageBtn')?.addEventListener('click', () => { if (currentPage > 1) { currentPage--; renderTable(); } });
        document.getElementById('nextPageBtn')?.addEventListener('click', () => { if (currentPage < totalPages) { currentPage++; renderTable(); } });
        document.querySelectorAll('.page-num-btn').forEach(btn => {
            btn.addEventListener('click', (e) => { const pg = parseInt(btn.dataset.page); if (!isNaN(pg) && pg !== currentPage) { currentPage = pg; renderTable(); } });
        });
    }
    
    function updatePaginationInfo() {
        const total = filteredUsers.length;
        const start = (currentPage-1)*rowsPerPage + 1;
        const end = Math.min(currentPage*rowsPerPage, total);
        document.getElementById('paginationInfo').innerHTML = total === 0 ? '<i class="fas fa-database mr-1"></i> 0 results' : `<i class="fas fa-users mr-1"></i> Showing ${start}–${end} of ${total} results`;
    }
    
    function escapeHtml(str) { if (!str) return ''; return str.replace(/[&<>]/g, function(m){ if(m==='&') return '&amp;'; if(m==='<') return '&lt;'; if(m==='>') return '&gt;'; return m;}); }
    
    // Modal logic
    const modal = document.getElementById('addUserModal');
    function openModal() { modal.classList.remove('hidden'); }
    function closeModal() { modal.classList.add('hidden'); }
    document.getElementById('addUserBtn').addEventListener('click', openModal);
    document.getElementById('closeModalBtn').addEventListener('click', closeModal);
    document.getElementById('cancelModalBtn').addEventListener('click', closeModal);
    document.getElementById('confirmAddBtn').addEventListener('click', () => {
        const id = document.getElementById('newId').value.trim();
        const email = document.getElementById('newEmail').value.trim();
        const name = document.getElementById('newName').value.trim();
        const access = document.getElementById('newAccess').checked;
        let docId = document.getElementById('newDocId').value.trim();
        if (!docId) docId = 'usr_' + Math.random().toString(36).substring(2, 12);
        let metadataRaw = document.getElementById('newMetadata').value.trim();
        let metadata = { segments: ["test"] };
        try { if(metadataRaw) metadata = JSON.parse(metadataRaw); } catch(e) { alert("Invalid JSON, using default metadata"); }
        let dateRegistered = document.getElementById('newDateReg').value;
        if (!dateRegistered) dateRegistered = new Date().toISOString().split('T')[0];
        let password = document.getElementById('newPassword').value.trim();
        if (!password) password = "default123";
        if (!id || !email || !name) { alert("Please fill ID, Email and Name"); return; }
        if (allUsers.some(u => u.id === id)) { alert("User ID already exists"); return; }
        if (allUsers.some(u => u.email === email)) { alert("Email already registered"); return; }
        const newUser = { id, email, name, access, docId, metadata, dateRegistered, password };
        allUsers.push(newUser);
        applyFilter();
        updateStats();
        closeModal();
        document.getElementById('newId').value = '';
        document.getElementById('newEmail').value = '';
        document.getElementById('newName').value = '';
        document.getElementById('newAccess').checked = true;
        document.getElementById('newDocId').value = '';
        document.getElementById('newMetadata').value = '{"segments": ["test"]}';
        document.getElementById('newDateReg').value = '';
        document.getElementById('newPassword').value = '';
    });
    
    function downloadCSV() {
        if (filteredUsers.length === 0) { alert("No data to export"); return; }
        const headers = ["#", "ID", "Email", "Name", "Access", "DocId", "Metadata", "Date Registered", "Password"];
        const rows = filteredUsers.map((user, idx) => [
            idx+1, user.id, user.email, user.name, user.access ? "Active" : "Inactive", user.docId, JSON.stringify(user.metadata), user.dateRegistered, user.password
        ]);
        const csvContent = [headers, ...rows].map(row => row.map(cell => `"${String(cell).replace(/"/g, '""')}"`).join(",")).join("\n");
        const blob = new Blob(["\uFEFF" + csvContent], { type: "text/csv;charset=utf-8;" });
        const link = document.createElement("a");
        const url = URL.createObjectURL(blob);
        link.setAttribute("href", url);
        link.setAttribute("download", "firebase_users_export.csv");
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(url);
    }
    document.getElementById('downloadBtn').addEventListener('click', downloadCSV);
    
    function refreshData() {
        allUsers = createInitialUsers();
        currentSearchTerm = "";
        document.getElementById('searchInput').value = "";
        showPasswords = false;
        document.getElementById('togglePasswordsBtn').innerHTML = '<i class="fas fa-eye"></i> Show Passwords';
        applyFilter();
        updateStats();
        currentPage = 1;
        renderTable();
    }
    document.getElementById('refreshBtn').addEventListener('click', refreshData);
    
    const searchInput = document.getElementById('searchInput');
    searchInput.addEventListener('input', (e) => {
        currentSearchTerm = e.target.value;
        applyFilter();
    });
    
    const toggleBtn = document.getElementById('togglePasswordsBtn');
    toggleBtn.addEventListener('click', () => {
        showPasswords = !showPasswords;
        toggleBtn.innerHTML = showPasswords ? '<i class="fas fa-eye-slash"></i> Hide Passwords' : '<i class="fas fa-eye"></i> Show Passwords';
        renderTable();
    });
    
    // Initial render
    updateStats();
    applyFilter();
</script>
</body>
</html>
